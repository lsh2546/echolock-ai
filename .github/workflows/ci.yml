name: EchoLock CI

# All third-party GitHub Actions are pinned to immutable full commit SHAs.
# No mutable tag or branch reference (e.g. @v4, @main) is used.
# SHA provenance:
#   actions/checkout      v4.2.2   => 11bd71901bbe5b1630ceea73d27597364c9af683
#   actions/setup-python  v5.3.0   => 0acd30b01e21827f5e942adb5d7a31a0d57cf1e3
#   trufflesecurity/trufflehog v3.88.1 => 4e8ec9a28d7c35f6f8462660063f62cd7d61a62c
# Verification source: github.com/<owner>/<repo>/releases/tag/<version>
# KL-2 resolved: 2026-08-23

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@0acd30b01e21827f5e942adb5d7a31a0d57cf1e3  # v5.3.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run tests with coverage (branch coverage)
        run: |
          pytest tests/ -v --tb=short --cov=src/echolock --cov-report=term-missing --cov-branch

      - name: Architecture check (safety_gate has no AI imports)
        run: |
          pytest tests/test_architecture.py -v

  secret-scan:
    name: Secret Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository (full history for secret scan)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          fetch-depth: 0

      - name: Run trufflehog
        # Uses ${{ github.event.before }} as base — safe on first commit (no HEAD~1).
        uses: trufflesecurity/trufflehog@4e8ec9a28d7c35f6f8462660063f62cd7d61a62c  # v3.88.1
        with:
          path: ./
          base: ${{ github.event.before || github.sha }}
          head: HEAD
          extra_args: --only-verified
