[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "echolock"
version = "0.1.0"
description = "Intent-Preserving Command Escrow for Deep-Space Missions"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0",
    "fastapi>=0.110",
    "uvicorn>=0.29",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "hypothesis>=6.100",
    "httpx>=0.27",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.hatch.build.targets.wheel]
packages = ["src/echolock"]

[tool.coverage.run]
source = ["src/echolock"]
omit = ["*/tests/*"]

[tool.coverage.report]
show_missing = true
fail_under = 80
