<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="t d">
  <title id="t">EchoLock trust-boundary architecture</title><desc id="d">Sealed command and Mission Intent Envelope enter a deterministic safety core. Optional AI is an untrusted proposer. Decisions feed counterfactual evidence, Delta Certificate, and audit chain.</desc>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3L0 6z" fill="#71f6bd"/></marker><style>.box{fill:#0b1916;stroke:#31564a;stroke-width:2}.core{fill:#103026;stroke:#71f6bd;stroke-width:3}.txt{fill:#eef8f2;font:700 21px Arial}.sub{fill:#9db8ad;font:16px Arial}.arr{stroke:#71f6bd;stroke-width:3;fill:none;marker-end:url(#a)}</style></defs>
  <rect width="1600" height="900" fill="#06100e"/><text x="80" y="70" fill="#71f6bd" font-family="Arial" font-size="25" font-weight="700" letter-spacing="4">ECHOLOCK TRUST BOUNDARIES</text>
  <rect x="440" y="110" width="760" height="545" rx="28" fill="#0a1714" stroke="#71f6bd" stroke-width="2" stroke-dasharray="10 8"/><text x="470" y="148" fill="#71f6bd" font-family="monospace" font-size="17">TRUSTED DETERMINISTIC SAFETY CORE</text>
  <rect class="box" x="60" y="190" width="280" height="105" rx="18"/><text class="txt" x="90" y="232">Sealed command</text><text class="sub" x="90" y="267">Untouched original</text>
  <rect class="box" x="60" y="350" width="280" height="120" rx="18"/><text class="txt" x="90" y="392">Mission Intent</text><text class="txt" x="90" y="420">Envelope</text><text class="sub" x="90" y="452">Goals · invariants · authority</text>
  <rect x="60" y="560" width="280" height="110" rx="18" fill="#211c12" stroke="#ffcf70" stroke-width="2" stroke-dasharray="8 6"/><text x="90" y="602" fill="#ffcf70" font-family="Arial" font-size="21" font-weight="700">Optional AI proposer</text><text class="sub" x="90" y="638">Untrusted candidate only</text>
  <rect class="core" x="485" y="190" width="260" height="105" rx="18"/><text class="txt" x="515" y="232">Seal verification</text><text class="sub" x="515" y="267">Fail closed at boundary</text>
  <rect class="core" x="840" y="190" width="300" height="105" rx="18"/><text class="txt" x="870" y="232">State Drift Report</text><text class="sub" x="870" y="267">Arrival reality vs assumptions</text>
  <rect class="core" x="485" y="365" width="300" height="110" rx="18"/><text class="txt" x="515" y="408">Intent-Safe Patch</text><text class="sub" x="515" y="443">Separate authorised delta</text>
  <rect class="core" x="840" y="365" width="300" height="110" rx="18"/><text class="txt" x="870" y="408">Safety Gate</text><text class="sub" x="870" y="443">Hard invariants + GPS ≥ 0.70</text>
  <rect class="core" x="650" y="530" width="330" height="90" rx="18"/><text class="txt" x="680" y="568">Verdict precedence</text><text class="sub" x="680" y="598">EXECUTE · ADAPT · DEFER · REJECT</text>
  <rect class="box" x="1270" y="170" width="270" height="110" rx="18"/><text class="txt" x="1300" y="212">Counterfactual</text><text class="sub" x="1300" y="247">Three futures · evidence only</text>
  <rect class="box" x="1270" y="350" width="270" height="110" rx="18"/><text class="txt" x="1300" y="392">Delta Certificate</text><text class="sub" x="1300" y="427">Canonical JSON · SHA-256</text>
  <rect class="box" x="1270" y="530" width="270" height="110" rx="18"/><text class="txt" x="1300" y="572">Audit chain</text><text class="sub" x="1300" y="607">Hash-linked PoC entries</text>
  <path class="arr" d="M340 242H485"/><path class="arr" d="M340 410C405 410 400 260 485 260"/><path class="arr" d="M745 242H840"/><path class="arr" d="M990 295V365"/><path class="arr" d="M340 615H485V440" stroke-dasharray="8 7"/><path class="arr" d="M785 420H840"/><path class="arr" d="M990 475C990 525 930 550 980 575"/><path class="arr" d="M980 575H1270V225"/><path class="arr" d="M980 575H1205V405H1270"/><path class="arr" d="M1405 460V530"/>
  <rect x="80" y="730" width="1440" height="105" rx="20" fill="#0b1916" stroke="#31564a"/><text x="115" y="770" fill="#eef8f2" font-family="Arial" font-size="23" font-weight="700">Production adapters:</text><text x="380" y="770" fill="#9db8ad" font-family="Arial" font-size="21">mission telemetry · approved flight rules · validated digital twin · persistent audit anchor</text><text x="115" y="808" fill="#71f6bd" font-family="Arial" font-size="18">AI may propose. Only the deterministic gate authorises execution.</text>
